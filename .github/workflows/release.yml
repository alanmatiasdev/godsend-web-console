name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  packages:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false
      - name: Build web console and integration kit
        run: |
          npm ci
          npm run build
          npm run package
      - name: Download pinned GODsend source and integrate
        env:
          GODSEND_SHA: ff70dadc7c86c8a52dbd366595ae93419d4b55f4
        run: |
          set -euo pipefail
          mkdir -p upstream
          curl --fail --location --retry 3 "https://github.com/ghostyshell/GODSend-360/archive/${GODSEND_SHA}.tar.gz" | tar xz -C upstream --strip-components=1
          node scripts/integrate.mjs upstream
      - name: Test integrated Go handlers
        working-directory: upstream/src/server
        run: go test ./interfaces/http
      - name: Build binary packages
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: bash scripts/build-binaries.sh upstream "$RELEASE_TAG" release
      - name: Checksums
        working-directory: release
        run: sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Attach packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/*.tar.gz release/*.zip release/SHA256SUMS --clobber
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish GODsend image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/${{ github.repository }}:latest
