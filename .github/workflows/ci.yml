name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package
      - name: Inspect integration kit
        run: |
          set -euo pipefail
          kit="$(find release -name 'godsend-web-console-*.tar.gz' -print -quit)"
          test -n "$kit"
          tar tzf "$kit" | grep -E '/dist/index.html$'
          tar tzf "$kit" | grep -E '/scripts/integrate.mjs$'
          tar tzf "$kit" | grep -E '/integration/serve_webui.go$'
